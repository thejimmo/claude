<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" width="520" height="490">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ED3F0"/>
      <stop offset="100%" stop-color="#3A9DD5"/>
    </linearGradient>
  </defs>

  <!-- White backdrop polygon -->
  <polygon points="218,6 398,72 478,295 356,468 164,468 18,295 102,72" fill="white"/>

  <!-- Gold / yellow shape (back layer) -->
  <g transform="translate(256,248) rotate(10) translate(-256,-248)">
    <rect x="60" y="112" width="390" height="270" rx="14" fill="#F5A623"/>
  </g>

  <!-- Orange shape (mid layer) -->
  <g transform="translate(270,215) rotate(-10) translate(-270,-215)">
    <rect x="78" y="80" width="378" height="268" rx="14" fill="#F26B3A"/>
  </g>

  <!-- Blue gradient rect + text (front layer, slightly tilted) -->
  <g transform="translate(250,232) rotate(-5) translate(-250,-232)">
    <rect x="58" y="104" width="384" height="262" rx="14" fill="url(#blueGrad)"/>
    <text
      x="250" y="277"
      font-family="'Arial Rounded MT Bold', 'Nunito', 'Varela Round', 'Trebuchet MS', Arial"
      font-weight="900"
      font-size="172"
      fill="white"
      text-anchor="middle"
      paint-order="stroke"
      stroke="white"
      stroke-width="2"
    >JK99</text>
  </g>
</svg>
